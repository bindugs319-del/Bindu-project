[pytest]
asyncio_mode = auto
testpaths = 
python_files = test_*.py *_test.py
python_functions = test_*
python_classes = Test*
norecursedirs = 
    node_modules
    .git
    .venv
    venv
    dist
    build
    .scannerwork
    uploads
    server/uploads
    server/app/scripts
    server/scripts
    server/migrations
    docs
    client
addopts = 
    --strict-markers
    --tb=short
    --ignore=server/app/scripts
    --ignore=server/scripts
    --ignore=server/migrations
    --ignore=uploads
    --ignore=server/uploads

